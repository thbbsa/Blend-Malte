<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<header>
    <a class="logo" routerLink="/"><img src="imgs/logo.png" alt="Blend & Malte"></a>
    <nav>
        <ul class="menu">
            <li><a routerLink="/produtos/vinhos">Vinhos</a></li>
            <li><a routerLink="/produtos/cervejas">Cervejas</a></li>
            <li><a routerLink="/produtos/destilados">Destilados</a></li>
            <li><a routerLink="/produtos">Ofertas</a></li>
            <li><a routerLink="/manutencao-produtos">Manutenção</a></li>
        </ul>
    </nav>

    <form class="busca" role="search" (submit)="buscar($event, campo.value)">
        <input #campo type="search" placeholder="Buscar produtos" aria-label="Buscar produtos">
        <button type="submit" aria-label="Buscar"><i class="bi bi-search"></i></button>
    </form>

    <div class="acoes">
        <a routerLink="/login">
            <i class="bi bi-person"></i>
            <span>Perfil</span>
        </a>
        <a routerLink="/carrinho">
            <i class="bi bi-cart3"></i>
            <span>Carrinho</span>
            <b class="contador">{{ itensNoCarrinho() }}</b>
        </a>
    </div>
</header>
