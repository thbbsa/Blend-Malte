<app-header></app-header>
<main><section class="login-card">
  <h1>Entrar na conta</h1>
  <p class="sub">A API confere suas credenciais.</p>
  <p>Cliente: <strong>cliente@blendmalte.com</strong> / <strong>123456</strong></p>
  <p>Admin: <strong>admin@blendmalte.com</strong> / <strong>admin123</strong></p>
  <form #form="ngForm" (ngSubmit)="entrar(form)">
    <label for="email">E-mail</label><input id="email" name="email" type="email" [(ngModel)]="email" autocomplete="username" required email>
    <label for="senha">Senha</label><input id="senha" name="senha" type="password" [(ngModel)]="senha" autocomplete="current-password" required>
    @if (erro) { <p class="erro" role="alert">{{ erro }}</p> }
    <button type="submit" [disabled]="carregando">{{ carregando ? 'Consultando API...' : 'Entrar' }}</button>
  </form>
  <p class="links"><a routerLink="/cadastro-cliente">Criar conta</a></p>
</section></main>
<app-footer />
