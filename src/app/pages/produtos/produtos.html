<app-header></app-header>

<main>
  <h1>Produtos da Adega</h1>

  @if (erro) { <p role="alert">{{ erro }}</p> }
  @if (carregando) { <p class="estado-listagem" role="status">Carregando produtos...</p> }
  <div class="lista-produtos">
    @for (p of produtosFiltrados(); track p.id) {
    <app-product-card [produto]="p"></app-product-card>
    }
    @if (!carregando && !erro && produtosFiltrados().length === 0) {
      <p class="estado-listagem">Nenhum produto encontrado nesta categoria.</p>
    }
  </div>
</main>

<app-footer></app-footer>
