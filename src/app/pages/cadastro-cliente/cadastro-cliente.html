<div class="cadastro-container">
  
  <div class="form-card">
    <h2>Criar sua Conta</h2>
    <p>Preencha os campos abaixo para se cadastrar na Blend & Malte</p>

    <form (ngSubmit)="cadastrar()">
      
      <div class="form-group">
        <label for="nome">Nome Completo *</label>
        <input type="text" id="nome" name="nome" [(ngModel)]="cliente.nome" placeholder="Digite seu nome completo" required>
      </div>

      <div class="form-group">
        <label for="cpf">CPF *</label>
        <input type="text" id="cpf" name="cpf" [(ngModel)]="cliente.cpf" placeholder="000.000.000-00" required>
      </div>

      <div class="form-group">
        <label for="usuario">Nome de Usuário *</label>
        <input type="text" id="usuario" name="usuario" [(ngModel)]="cliente.usuario" placeholder="Digite seu nome de usuário" required>
      </div>

      <div class="form-group">
        <label for="email">E-mail *</label>
        <input type="email" id="email" name="email" [(ngModel)]="cliente.email" placeholder="seuemail@exemplo.com" required>
      </div>

      <div class="form-group">
        <label for="telefone">Telefone *</label>
        <input type="tel" id="telefone" name="telefone" [(ngModel)]="cliente.telefone" placeholder="(00) 00000-0000" required>
      </div>

      <div class="form-group">
        <label for="senha">Senha *</label>
        <input type="password" id="senha" name="senha" [(ngModel)]="cliente.senha" placeholder="Digite sua senha" required>
      </div>

      <div class="form-group">
        <label for="confirmarSenha">Confirmação de Senha *</label>
        <input type="password" id="confirmarSenha" name="confirmarSenha" [(ngModel)]="cliente.confirmarSenha" placeholder="Confirme sua senha" required>
      </div>

      <!-- Botão de Cadastro -->
      <button type="submit" class="btn-cadastrar">Cadastrar</button>
    </form>
  </div>

</div>
