name: Deploy GitHub Pages

on:
  push:
    branches: [experiment]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Configure API URL
        env:
          API_URL: ${{ vars.API_URL }}
        run: |
          if [ -z "$API_URL" ]; then
            echo "Configure a repository variable named API_URL with the public HTTPS API address." >&2
            exit 1
          fi
          node -e "require('fs').writeFileSync('src/environments/environment.production.ts', 'export const environment = { apiUrl: ' + JSON.stringify(process.env.API_URL) + ' };\\n')"
      - run: npm run build:pages
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/adega-express/browser

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
